<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Halaman Pemesanan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <nav><a href="dashboard.html">&larr; Kembali ke Dashboard</a></nav>
        <h2 style="margin-top: 10px;">Form Pemesanan Buku</h2>

        <form id="formCheckout" onsubmit="prosesCheckout(event)">
            <div class="form-group">
                <label>Nama Pemesan</label>
                <input type="text" id="namaPemesan" required placeholder="Masukkan nama Anda">
            </div>
            <div class="form-group">
                <label>Pilih Buku</label>
                <select id="pilihBuku" required>
                    <!-- Option diisi oleh JS -->
                </select>
            </div>
            <div class="form-group">
                <label>Jumlah</label>
                <input type="number" id="jumlahBuku" value="1" min="1" required>
            </div>
            <div class="form-group">
                <label>Metode Pembayaran</label>
                <select id="metodeBayar">
                    <option value="Transfer Bank">Transfer Bank</option>
                    <option value="E-Wallet">E-Wallet (Gopay/OVO)</option>
                    <option value="COD">COD (Bayar di Tempat)</option>
                </select>
            </div>
            <button type="submit">Konfirmasi Pemesanan</button>
        </form>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
    <script>
        loadBukuOptions();
    </script>
</body>
</html>
